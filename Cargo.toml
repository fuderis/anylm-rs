[package]
name = "anylm"
version = "0.3.5"
description = "The universal API for all AI services that you know"
keywords = ["lm", "api", "ai", "llm", "slm"]
categories = ["development-tools", "rust-patterns"]
license = "MIT"
authors = ["Bulat Sh. <t.me/fuderis>"]
repository = "https://github.com/fuderis/anylm-rs"
readme = "README.md"
edition = "2024"

[dependencies]
atoman = { version = "0.11.6", features = ["channel"] }
macron = { version = "0.5.1", features = ["derive", "string"] }
pearce = { version = "0.5.2", features = ["stream"] }

base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.31"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["rustls", "json", "stream", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tiktoken-rs = "0.9.1"

[features]
full = ["anthropic", "google"]
anthropic = []
google = []
